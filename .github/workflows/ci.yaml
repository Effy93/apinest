name: apinest CI
on:
  push:
    branches: [dev, main]
jobs:
  build:
    name: node22 on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: run test
        run: npm run test

